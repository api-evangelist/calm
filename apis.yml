aid: calm
name: Calm
description: 'Calm is a leading consumer mental-wellness company whose app offers guided meditations,
  Sleep Stories, breathing programs, mindfulness masterclasses, and soundscapes. Beyond the direct-to-consumer
  app, Calm sells two B2B products: Calm Business, which delivers the Calm experience to employers as
  an employee wellness benefit, and Calm Health, a clinical mental-health offering for health plans and
  large self-insured employers. Both are powered by the Calm Partner API, an OAuth 2.0 client-credentials
  REST surface that partner HR and benefits systems use to provision, link, and cancel Calm subscriptions
  for their members, alongside SAML 2.0 IdP-initiated SSO and SFTP eligibility-file uploads. Calm is a
  portfolio company of Lightspeed Venture Partners.'
